name: 200-sample LLM prompt benchmark

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: Number of held-out products
        required: true
        default: '200'
      provider:
        description: LLM provider
        required: true
        type: choice
        options: [groq, openrouter]
        default: groq

permissions:
  contents: write
concurrency:
  group: prompt-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run reproducible benchmark
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL_NAME: ${{ inputs.provider == 'groq' && 'openai/gpt-oss-20b' || 'meta-llama/llama-3.1-8b-instruct' }}
          SAMPLE_SIZE: ${{ inputs.sample_size }}
          TEST_SIZE: '0.20'
          DEMO_SIZE: '4'
          RANDOM_SEED: '42'
          TEMPERATURE: '0'
          MAX_TOKENS: '512'
          RETRY_LIMIT: '3'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m experiments.run_experiment
      - name: Build human-readable research report
        run: python -m experiments.build_report
      - name: Upload raw results and report
        uses: actions/upload-artifact@v4
        with:
          name: prompt-benchmark-${{ github.run_number }}
          path: |
            results/*.json
            reports/*.md
          if-no-files-found: error
          retention-days: 90
      - name: Publish results directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/*.json reports/*.md
          if git diff --cached --quiet; then echo 'No new result files'; exit 0; fi
          git commit -m 'Publish ${{ inputs.sample_size }}-sample prompt benchmark results'
          git push origin HEAD:main
